[workspace]
members = ["crates/*"]
resolver = "2"
exclude = [
     "examples/end-user-happ",
     "examples/holochain-runtime" ,
     "crates/scaffold-holochain-runtime" , 
     "crates/scaffold-tauri-happ"
]

[patch.crates-io]
kitsune2 = { git = "https://github.com/holochain/kitsune2", branch = "refactor/do-not-block-peers-by-default" }
kitsune2_api = { git = "https://github.com/holochain/kitsune2", branch = "refactor/do-not-block-peers-by-default" }
kitsune2_core = { git = "https://github.com/holochain/kitsune2", branch = "refactor/do-not-block-peers-by-default" }
kitsune2_dht = { git = "https://github.com/holochain/kitsune2", branch = "refactor/do-not-block-peers-by-default" }
kitsune2_gossip = { git = "https://github.com/holochain/kitsune2", branch = "refactor/do-not-block-peers-by-default" }
kitsune2_bootstrap_client = { git = "https://github.com/holochain/kitsune2", branch = "refactor/do-not-block-peers-by-default" }
